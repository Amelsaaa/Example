<html>
	<head>
    	<title>Form Pre-order Makanan</title>
        	<style>
        	/* Reset default margin and padding */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }


        .container {
            background-color: #fff;
            width: 90%;
            max-width: 600px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }


        h2, h3 {
            color: #333;
            text-align: center;
        }


        label {
            font-weight: bold;
            margin-top: 10px;
            display: block;
        }


        input[type="text"],
        input[type="number"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }


        input[type="button"],
        input[type="reset"] {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            font-size: 1em;
            font-weight: bold;
            color: #fff;
            background-color: #4CAF50;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }


        input[type="button"]:hover,
        input[type="reset"]:hover {
            background-color: #45a049;
        }


        #buktiPreOrderMakanan {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            background-color: #e6f7ff;
            border-left: 5px solid #0099cc;
        }


        .item-section {
            margin-bottom: 15px;
        }
    	</style>
    <script language="JavaScript" type="text/javascript">
		//Input daftar item dan harga menu
			var items = [
            { id: "qtyNasiAyam", harga: 20000, nama: "Nasi Ayam Daun Jeruk"},
            { id: "qtyPudding", harga: 8000, nama: "Pudding" },
            { id: "qtySamosa", harga: 20000, nama: "Samosa" },
            { id: "qtyKentang", harga: 10000, nama: "Kentang Mustofa" }
        ];


        //Proses hitung function
        function hitungTotalDenganPerulangan() {
            var totalHarga = 0;
            
            for (var i = 0; i < items.length; i++) {
                var qty = parseInt(document.getElementById(items[i].id).value);
                if (isNaN(qty) || qty < 0) qty = 0;  //Qty jika tidak diisi atau negatif
                totalHarga += qty * items[i].harga;
            }
            
            document.getElementById("totalHarga").value = totalHarga;
        }


        function tampilkanKeterangan() {
            var metodePembayaran = document.getElementById("metodePembayaran").value;
            var keterangan;


            if (metodePembayaran === "Tunai") {
                keterangan = "Bayar di tempat";
            } else if (metodePembayaran === "TransferBank") {
                keterangan = "No. Rekening = 1234-5678-90";
            } else if (metodePembayaran === "EWallet") {
                keterangan = "No. Telepon = 08123456789";
            }
            document.getElementById("keteranganPembayaran").innerText = keterangan;
        }


	function hitungKembalian() {
		totalHarga =parseInt(document.getElementById("totalHarga").value);
		var pembayaran =parseInt(document.getElementById("pembayaran").value);
		var kembalian =pembayaran - totalHarga;


		if(isNaN(kembalian) || kembalian < 0) {
			alert("Uang tidak cukup!");
		}
		document.getElementById("kembalian").value = kembalian;
	}


        function tampilkanBuktiPreOrderMakanan() {
            var namaPelanggan = document.getElementById("namaPelanggan").value;
            var nomorTelepon = document.getElementById("nomorTelepon").value;
            var email = document.getElementById("email").value;
            var alamatPengiriman = document.getElementById("alamatPengiriman").value;
            var tanggalPreOrder = document.getElementById("tanggalPreOrder").value;
            var tanggalPengiriman = document.getElementById("tanggalPengiriman").value;
            var totalHarga = document.getElementById("totalHarga").value;
            var metodePembayaran = document.getElementById("metodePembayaran").value;
	var pembayaran = document.getElementById("pembayaran").value;
	var kembalian = document.getElementById("kembalian").value;


            //Output
            var bukti = `
                <h3>Bukti Pre-order Makanan</h3>
                <p><strong>Nama Pelanggan:</strong> ${namaPelanggan}</p>
                <p><strong>Nomor Telepon:</strong> ${nomorTelepon}</p>
                <p><strong>Email:</strong> ${email}</p>
                <p><strong>Alamat Pengiriman:</strong> ${alamatPengiriman}</p>
                <p><strong>Tanggal Pre-order:</strong> ${tanggalPreOrder}</p>
                <p><strong>Tanggal Pengiriman:</strong> ${tanggalPengiriman}</p>
                <p><strong>Total Harga:</strong> Rp ${totalHarga}</p>
                <p><strong>Metode Pembayaran:</strong> ${metodePembayaran}</p>
	            <p><strong>Pembayaran:</strong> ${pembayaran}</p>
	            <p><strong>Kembalian:</strong> ${kembalian}</p>
            `;
            document.getElementById("buktiPreOrderMakanan").innerHTML = bukti;
        }
	</script>
</head>
<body>
	<div class="container">
        <br><h2>Form Pre-order Makanan</h2><br>
        <form action="index.html" method="post">
            <label for="namaPelanggan">Nama Pelanggan</label>
            <input type="text" id="namaPelanggan" required><br>


            <label for="nomorTelepon">Nomor Telepon</label>
            <input type="text" id="nomorTelepon" required><br>


            <label for="email">Email</label>
            <input type="text" id="email" required><br>


            <label for="alamatPengiriman">Alamat Pengiriman</label>
            <textarea id="alamatPengiriman" rows="3" required></textarea><br>


            <label for="tanggalPreOrder">Tanggal Pre-order</label>
            <input type="date" id="tanggalPreOrder" required><br>


            <label for="tanggalPengiriman">Tanggal Pengiriman</label>
            <input type="date" id="tanggalPengiriman" required><br>
            <div class="item-section">
                <br><h3>Pre-Order</h3><br>
                <label>Nasi Ayam Daun Jeruk - Quantity</label>
                <input type="number" id="qtyNasiAyam" min="0" value="0" required><br>


                <label>Pudding - Quantity</label>
                <input type="number" id="qtyPudding" min="0" value="0" required><br>


                <label>Samosa - Quantity</label>
                <input type="number" id="qtySamosa" min="0" value="0" required><br>


                <label>Kentang Mustofa - Quantity</label>
                <input type="number" id="qtyKentang" min="0" value="0" required><br>
            </div>
                <br>
            <input type="button" value="Hitung Total" onclick="hitungTotalDenganPerulangan()"><br>
            <label for="totalHarga">Total Harga</label>
            <input type="text" id="totalHarga" readonly><br>


            <div class="item-section">
                <br><h3>Pembayaran</h3><br>
                <label for="metodePembayaran">Metode Pembayaran</label>
                <select id="metodePembayaran" onchange="tampilkanKeterangan()">
                    <option value="Tunai">Tunai</option>
                    <option value="TransferBank">Transfer Bank</option>
                    <option value="EWallet">E-Wallet</option>
                </select>
                <p id="keteranganPembayaran"></p>
            </div>


		<label for="pembayaran">Pembayaran</label>
		<input type="number" id="pembayaran" min="0"><br>


		<input type="button" value="Hitung Kembalian" onclick="hitungKembalian()"><br>
		<input type="text" id="kembalian" readonly><br>


            <input type="button" value="Tampilkan Bukti Pre-order Makanan" onclick="tampilkanBuktiPreOrderMakanan()">
        </form>


        <br><div id="buktiPreOrderMakanan"></div>
    </div>
</body>
</html>
